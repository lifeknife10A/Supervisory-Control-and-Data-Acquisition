; PlatformIO project file for the SCADA ESP32 edge node.
; Build with:   pio run -e esp32dev   (physical board: real ACS712/MQ-2 conversions, MQ-2 warm-up)
;               pio run -e wokwi      (simulator: potentiometer current stand-in, no warm-up)
; Wokwi reads the wokwi build's firmware.bin/.elf via wokwi.toml - see README.md.

[platformio]
default_envs = esp32dev

[env:esp32dev]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
lib_deps =
	emelianov/modbus-esp8266@^4.1.0
	marcoschwartz/LiquidCrystal_I2C@^1.1.4
	paulstoffregen/OneWire@^2.3.7
	milesburton/DallasTemperature@^3.11.0
	adafruit/Adafruit BME280 Library@^2.2.4

[env:wokwi]
extends = env:esp32dev
build_flags = -DWOKWI_SIM
